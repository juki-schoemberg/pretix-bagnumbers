[project]
name = "pretix-bagnumbers"
version = "1.0.0"
description = "Sequential bag numbers with configurable number ranges per product"
readme = "README.md"
authors = [{ name = "JuKi Schömberg e.V." }]
license = "Apache-2.0"
dependencies = []

[project.urls]
Homepage = "https://github.com/juki-schoemberg/pretix-bagnumbers"
Repository = "https://github.com/juki-schoemberg/pretix-bagnumbers"

[project.entry-points."pretix.plugin"]
pretix_bagnumbers = "pretix_bagnumbers:PretixPluginMeta"

[tool.setuptools.packages.find]
include = ["pretix_bagnumbers*"]

[tool.setuptools.package-data]
pretix_bagnumbers = ["templates/**/*.html", "migrations/*.py", "locale/**/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
